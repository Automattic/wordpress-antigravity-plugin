name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Check tag and plugin version
        shell: bash
        run: |
          version="$(node -p "require('./wordpress/plugin.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match plugin version ${version}" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/wordpress.zip > dist/wordpress.zip.sha256
          gh release create "${GITHUB_REF_NAME}" \
            dist/wordpress.zip dist/wordpress.zip.sha256 \
            --verify-tag \
            --title "WordPress plugin ${GITHUB_REF_NAME#v}" \
            --generate-notes
